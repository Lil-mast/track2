<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=http://localhost:3000/" />
    <title>RecoveryAI — AI That Turns Debt Recovery Into Customer Success</title>
    <meta
      name="description"
      content="RecoveryAI uses context-aware Generative AI to recommend personalized strategies that improve repayment rates without sacrificing customer relationships."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 480px;
        padding: 2rem;
      }

      .logo {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        margin-bottom: 1rem;
      }

      .tagline {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #0070f3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1.25rem;
      }

      .redirect-msg {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.3);
      }

      .link {
        color: #0070f3;
        text-decoration: none;
      }

      .link:hover {
        text-decoration: underline;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">RecoveryAI</div>
      <p class="tagline">
        AI That Turns Debt Recovery Into Customer Success.
      </p>
      <div class="spinner"></div>
      <p class="redirect-msg">
        Redirecting&hellip; If nothing happens,
        <a class="link" href="http://localhost:3000/">click here</a>.
      </p>
    </div>
  </body>
</html>
